services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      platforms:
        - linux/arm64
    ports:
      - "3004:3004"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
      - /app/.open-next
    environment:
      - NODE_ENV=development
    env_file:
      - .env
      - .dev.vars
